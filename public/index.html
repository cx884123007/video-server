<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 本地视频播放器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🎬</span>
                <span>本地视频</span>
            </div>
            <div class="header-info">
                <span class="path-display">📁 <span id="videoPath">加载中...</span></span>
                <button class="open-folder-btn" onclick="openVideoFolder()">打开文件夹</button>
                <span id="videoCount">0 个视频</span>
            </div>
        </div>
    </header>

    <!-- 播放器全屏容器 -->
    <div class="player-container" id="playerContainer">
        <div class="player-header">
            <div class="player-title" id="currentVideoName">正在播放</div>
            <div class="player-controls">
                <button class="control-btn" id="prevBtn" onclick="playPrevious()">⏮ 上一集</button>
                <button class="control-btn" id="nextBtn" onclick="playNext()">下一集 ⏭</button>
                <div class="speed-control">
                    <button class="speed-btn active" data-speed="1" onclick="setPlaybackSpeed('1')">1x</button>
                    <button class="speed-btn" data-speed="1.25" onclick="setPlaybackSpeed('1.25')">1.25x</button>
                    <button class="speed-btn" data-speed="1.5" onclick="setPlaybackSpeed('1.5')">1.5x</button>
                    <button class="speed-btn" data-speed="2" onclick="setPlaybackSpeed('2')">2x</button>
                </div>
                <button class="control-btn" onclick="toggleFullscreen()">⛶ 全屏</button>
                <button class="control-btn close-btn" onclick="closePlayer()">✕ 关闭</button>
            </div>
        </div>
        <video id="videoPlayer" controls></video>
        <div class="player-tips">
            💡 空格: 播放/暂停 | ←→: 快进10秒 | ↑↓: 音量 | n/p: 上下集
        </div>
    </div>

    <!-- 主内容区 -->
    <main class="container">
        <!-- 面包屑导航 -->
        <div class="breadcrumb-section">
            <div id="breadcrumb" class="breadcrumb"></div>
        </div>

        <!-- 页面标题 -->
        <div class="page-title">
            <h1>📂 全部视频</h1>
        </div>

        <!-- 内容网格 -->
        <div id="videoList" class="content-grid">
            <div class="loading">加载中...</div>
        </div>

        <!-- 空状态 -->
        <div class="empty-tip" id="emptyTip" style="display: none;">
            <div class="icon">📭</div>
            <p>暂无视频文件</p>
            <p class="hint">请将视频文件放到视频目录后刷新页面</p>
        </div>
    </main>

    <footer>
        <p>💾 播放进度自动保存 | 🎯 支持局域网访问 | ⌨️ 全键盘控制</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
